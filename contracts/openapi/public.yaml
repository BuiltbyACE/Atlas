openapi: 3.1.0
info:
  title: Atlas — Core API (public)
  version: 0.1.0
  description: |
    The Go core API (docs/ATLAS.md §11). This document is the source of truth
    for public routes; the TypeScript client is generated from it. Governed
    Go modules under the `crm`, `contracts`, `work`, `finance`, `people` and
    `systems` domains are added in later phases.
  contact:
    name: SafariStack
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development (Caddy proxies /api to this service)

paths:
  /api/v1/health:
    get:
      summary: Liveness probe
      description: Answers whether the process is up, without touching dependencies.
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      description: |
        Answers whether the service can serve traffic, reporting database and
        outbox state (docs/ATLAS.md §11). Returns 503 when anything is down.
      operationId: getHealthReady
      tags: [system]
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /api/v1/dev/hello:
    post:
      summary: Phase 0 demo event (local only)
      description: |
        Writes a `core.system.hello.v1` event to the transactional outbox
        (docs/ATLAS.md §7.1, Appendix A). Available only when ATLAS_ENV=local;
        returns 404 otherwise.
      operationId: postDevHello
      tags: [dev]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelloRequest"
      responses:
        "202":
          description: Event written to the outbox; the orchestrator is notified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
        "400":
          description: Invalid JSON body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not running in local mode, or route does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Check:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [up, down, skipped]
        detail: { type: string }
        latency_ms: { type: integer, format: int64 }
    HealthReport:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [up, down] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        detail: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem detail with Atlas extensions (§11).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code.
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    HelloRequest:
      type: object
      properties:
        message: { type: string, maxLength: 500 }
    HelloResponse:
      type: object
      required: [event_id, type, seq]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string }
        seq: { type: integer, format: int64 }
        note: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session cookie with an HttpOnly bearer token (Phase 1).

security: []
tags:
  - name: system
    description: Health and platform routes.
  - name: dev
    description: Local-development-only routes, never enabled outside ATLAS_ENV=local.